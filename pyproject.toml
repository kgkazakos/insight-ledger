[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-ledger"
version = "0.1.0"
description = "Manual + auto-proposed log for research activation. CPR Orbital #39."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kostas Kazakos", email = "kgkazakos@gmail.com" }]
keywords = ["ux-research", "product-research", "research-ops", "insights", "cpr-orbital"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["click>=8.1", "rich>=13.0"]

[project.optional-dependencies]
ui = ["streamlit>=1.32"]
llm = ["litellm>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.4", "streamlit>=1.32", "litellm>=1.40"]

[project.scripts]
insight-ledger = "insight_ledger.cli:cli"

[project.urls]
Homepage = "https://github.com/kgkazakos/insight-ledger"
Repository = "https://github.com/kgkazakos/insight-ledger"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
